<!doctype html>
<meta charset="utf-8">
<title>focusbarrel - lens barrel focus bench</title>
<style>
  :root{
    --bg:#111418; --panel:#181d23; --line:#2a323c; --ink:#e6edf3; --dim:#8b98a5;
    --grey:#4b5563; --amber:#d99a2b; --green:#2ea043; --red:#d1414a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
         padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .name{font-weight:650;letter-spacing:.2px}
  header .meta{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;
        align-items:start}
  @media(max-width:1100px){.wrap{grid-template-columns:1fr}}

  .viewbox{border:6px solid var(--grey);border-radius:10px;background:#000;
           overflow:auto;transition:border-color .12s;max-height:62vh;
           display:inline-flex;align-items:center;justify-content:center;
           max-width:100%}
  .viewbox.peak{border-color:var(--green);box-shadow:0 0 26px -4px var(--green)}
  .viewbox.off{border-color:var(--amber)}
  .viewbox.sweep{border-color:var(--grey)}
  .viewbox.scene{border-color:var(--red)}
  .viewbox.noisy{border-color:var(--red)}
  .viewbox img{display:block;image-rendering:pixelated}

  .verdict{padding:12px 14px;border-radius:10px;background:var(--panel);
           border:1px solid var(--line);margin-top:12px}
  .pct{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .state{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
  .hint{margin-top:6px;color:var(--ink);font-size:15px}
  .arrow{font-size:34px;line-height:1;margin-left:auto}
  .row{display:flex;gap:14px;align-items:center}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:12px 14px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:12px;letter-spacing:1.2px;color:var(--dim);
           text-transform:uppercase;font-weight:650}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td{padding:3px 0;font-size:13px}
  td.k{color:var(--dim)}
  td.v{text-align:right}
  canvas{width:100%;height:130px;display:block;background:#0c0f13;border-radius:6px}
  #aim{width:100%;display:block;border-radius:6px;cursor:crosshair;background:#000}

  button,select{background:#222a33;color:var(--ink);border:1px solid var(--line);
                border-radius:7px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#2b343f}
  button.on{background:var(--green);border-color:var(--green);color:#04150a;font-weight:650}
  .seg button{border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
  .seg button:last-child{border-radius:0 7px 7px 0}
  .warn{color:var(--amber);font-size:12px;margin-top:8px;line-height:1.4}
  .bad{color:var(--red)}
  kbd{background:#222a33;border:1px solid var(--line);border-bottom-width:2px;
      border-radius:4px;padding:0 5px;font-size:11px;font-family:inherit}
</style>

<header>
  <span class="name">focusbarrel</span>
  <span class="meta" id="dev">-</span>
  <span class="seg" id="eyesel"></span>
  <button id="reset">Reset peak <kbd>R</kbd></button>
  <button id="peak">Peaking <kbd>P</kbd></button>
  <button id="tone">Tone <kbd>T</kbd></button>
  <button id="remeter">Re-meter</button>
  <button id="fast" title="Cap the shutter so the camera keeps 30 fps. Costs brightness.">30 fps</button>
  <span class="meta" style="margin-left:auto" id="fps"></span>
</header>

<div class="wrap">
  <div>
    <div class="viewbox" id="box"><img id="roi" alt="ROI"></div>
    <div class="verdict">
      <div class="row">
        <div>
          <div class="state" id="state">-</div>
          <div class="pct"><span id="pct">--</span><span style="font-size:20px;color:var(--dim)">% of best</span></div>
        </div>
        <div class="arrow" id="arrow"></div>
      </div>
      <div class="hint" id="hint">starting up...</div>
      <div class="warn" id="warn"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h3>Sharpness, last 60 s</h3>
      <canvas id="trace"></canvas>
    </div>
    <div class="card">
      <h3>Numbers</h3>
      <table id="nums"></table>
    </div>
    <div class="card">
      <h3>Aim &mdash; click to move the ROI</h3>
      <img id="aim" alt="full frame">
      <div class="row" style="margin-top:8px">
        <span class="meta">ROI size</span>
        <select id="roisize">
          <option value="0.15">15%</option>
          <option value="0.22">22%</option>
          <option value="0.30" selected>30%</option>
          <option value="0.40">40%</option>
          <option value="0.55">55%</option>
        </select>
        <button id="centre">Centre</button>
      </div>
    </div>
  </div>
</div>

<script>
let S = null, tone = false, actx = null, osc = null, gain = null;

const $ = id => document.getElementById(id);
const get = u => fetch(u).then(r => r.json());

document.getElementById('roi').src = '/roi.mjpg';
document.getElementById('aim').src = '/full.mjpg';

// ---- controls
$('reset').onclick   = () => get('/api/reset');
$('remeter').onclick = () => get('/api/remeter');
// Trade brightness for a smoother preview: capping the shutter at the knee keeps
// the camera at 30 fps instead of dropping to 15.
$('fast').onclick = () => {
  if (!S) return;
  const on = !$('fast').classList.contains('on');
  // Turning it back off has to restore the cap explicitly - a bare /api/remeter
  // re-meters with whatever cap is currently in force, which would leave the
  // shutter clamped and the button stuck on.
  get('/api/remeter?max=' + (on ? S.fps_knee : S.default_max_exposure));
};
$('peak').onclick    = () => {
  const on = !$('peak').classList.contains('on');
  get('/api/peaking?on=' + (on ? 1 : 0));
};
$('tone').onclick = () => { tone = !tone; $('tone').classList.toggle('on', tone); audio(); };
$('roisize').onchange = e => get('/api/roi?size=' + e.target.value);
$('centre').onclick = () => get('/api/roi?cx=0.5&cy=0.5');

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'r') $('reset').click();
  if (k === 'p') $('peak').click();
  if (k === 't') $('tone').click();
});

// Click the aiming view to move the ROI. The click lands in FULL-frame
// coordinates but the ROI is stored per eye, so work out which half was hit,
// switch to that eye, and convert into that eye's own fraction.
$('aim').onclick = ev => {
  if (!S) return;
  const r = ev.target.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
  const W = S.size.w, STRIP = 160;
  let eye = S.eye, cx = fx;
  if (S.stereo) {
    const lw = (W - STRIP) / 2, x = fx * W;
    if (x >= STRIP + lw) { eye = 'left';  cx = (x - STRIP - lw) / lw; }
    else                 { eye = 'right'; cx = (x - STRIP) / lw; }
  }
  cx = Math.max(0.02, Math.min(0.98, cx));
  get('/api/eye?e=' + eye).then(() => get('/api/roi?cx=' + cx.toFixed(4) + '&cy=' + fy.toFixed(4)));
};

// ---- audio: pitch tracks the reading so you can watch the barrel, not the screen
function audio() {
  if (tone && !actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    osc = actx.createOscillator(); gain = actx.createGain();
    osc.type = 'sine'; gain.gain.value = 0; osc.connect(gain); gain.connect(actx.destination);
    osc.start();
  }
  if (gain) gain.gain.value = tone ? 0.05 : 0;
}

// ---- render
function eyeButtons(st) {
  const box = $('eyesel');
  const eyes = Object.keys(st.eyes);
  if (box.dataset.n === String(eyes.length) + eyes.join()) return;
  box.dataset.n = String(eyes.length) + eyes.join();
  box.innerHTML = '';
  if (eyes.length < 2) return;
  for (const e of ['left', 'right']) {
    if (!st.eyes[e]) continue;
    const b = document.createElement('button');
    b.textContent = e === 'left' ? 'Left eye' : 'Right eye';
    b.onclick = () => get('/api/eye?e=' + e);
    b.dataset.eye = e;
    box.appendChild(b);
  }
}

function drawTrace(trace, band) {
  const c = $('trace'), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const LO = 0.4, HI = 1.05;                       // fraction-of-best window
  const Y = v => h - (Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO) * (h - 8) - 4;

  // the green band: anything above this line counts as being at the peak
  g.fillStyle = 'rgba(46,160,67,.16)';
  g.fillRect(0, Y(1.0 + 0.02), w, Y(1 - band) - Y(1.02));
  g.strokeStyle = 'rgba(46,160,67,.55)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, Y(1 - band)); g.lineTo(w, Y(1 - band)); g.stroke();

  if (!trace || trace.length < 2) return;
  g.strokeStyle = '#6cb6ff'; g.lineWidth = 2; g.beginPath();
  trace.forEach(([age, v], i) => {
    const x = w - (age / 60) * w;
    i ? g.lineTo(x, Y(v)) : g.moveTo(x, Y(v));
  });
  g.stroke();
}

function rows(st) {
  const e = st.eyes[st.eye] || {}, o = st.eyes[st.eye === 'left' ? 'right' : 'left'];
  const sc = e.scene || {};
  const r = [
    ['sweep span', (e.span || 0).toFixed(2) + '×' + ((e.span || 0) < 1.2 ? '  (too flat)' : '')],
    ['reading (2 s median)', (e.s || 0).toFixed(0) + '   live ' + (e.live || 0).toFixed(0)],
    ['best seen', (e.best || 0).toFixed(0) + '  (' + (e.age || 0).toFixed(0) + ' s ago)'],
    ['peak band', '±' + ((e.band || 0) * 100).toFixed(1) + '%  (noise ' + ((e.noise || 0) * 100).toFixed(1) + '%)'],
    ['ROI luma', (sc.mean || 0).toFixed(0) + '   clipped ' + (sc.clip || 0).toFixed(1) + '%'],
  ];
  if (o) r.push(['other eye', (o.s || 0).toFixed(0) + '  (' + ((o.pct || 0) * 100).toFixed(0) + '% of its own best)']);
  $('nums').innerHTML = r.map(([k, v]) =>
    '<tr><td class="k">' + k + '</td><td class="v">' + v + '</td></tr>').join('');
}

async function poll() {
  try {
    const st = await get('/state');
    S = st;
    if (!st.ok) { $('hint').textContent = st.err; $('hint').className = 'hint bad'; return; }

    $('dev').textContent = st.device + '  ' + st.size.w + '×' + st.size.h +
      (st.stereo ? '  stereo' : '  mono') + (st.locked ? '  · locked' : '  · AUTO (drifting)');
    $('fps').textContent = st.fps.toFixed(1) + ' fps';
    $('peak').classList.toggle('on', st.peaking);
    $('fast').classList.toggle('on', st.max_exposure <= st.fps_knee);

    eyeButtons(st);
    for (const b of $('eyesel').children) b.classList.toggle('on', b.dataset.eye === st.eye);

    const e = st.eyes[st.eye];
    if (!e) return;

    $('box').className = 'viewbox ' + e.state;
    $('state').textContent = { peak: 'at the peak', off: 'off peak', sweep: 'sweeping',
                               scene: 'bad framing', noisy: 'too noisy to call' }[e.state] || e.state;
    $('state').style.color = { peak: 'var(--green)', off: 'var(--amber)', sweep: 'var(--dim)',
                               scene: 'var(--red)', noisy: 'var(--red)' }[e.state];
    $('pct').textContent = (e.pct * 100).toFixed(1);
    $('arrow').textContent = e.state === 'peak' ? '✔'
                           : e.trend === 'up' ? '↗' : e.trend === 'down' ? '↘' : '↔';
    $('hint').textContent = e.hint;

    const w = [];
    if (!(e.scene || {}).ok) w.push((e.scene || {}).msg);
    // A band pinned at its ceiling means the verdict itself has gone coarse -
    // worth saying out loud, because the border still just turns green.
    if (e.band >= 0.0799 && (e.scene || {}).ok && e.state !== 'noisy')
      w.push('readings jitter ' + (e.noise * 100).toFixed(1) + '% frame to frame, which is as ' +
             'big as the focus change you are hunting — at this noise level the number cannot ' +
             'resolve a peak. Put more light on the target; this is a light problem, not a ' +
             'lens one.');
    // A peak you have not come near in a long time is usually a peak from a
    // different view, not a focus position you have failed to find again.
    if (e.age > 45 && e.pct < 1 - 2 * e.band && (e.scene || {}).ok)
      w.push('the best reading is ' + e.age.toFixed(0) + ' s old and you have not come near it ' +
             'since. If the camera, the target or the light moved in that time it is stale — ' +
             'press R to reset the peak and sweep again.');
    if (e.span < 1.2 && (e.scene || {}).ok)
      w.push('span is only ' + e.span.toFixed(2) + '× — a scene with content at many ' +
             'distances barely moves this number. Fill the ROI with print on one flat face.');
    (st.lock_notes || []).forEach(n => w.push(n));
    if (!st.locked) w.push('camera is on auto — the ISP will move this reading on its own.');
    $('warn').innerHTML = w.map(x => '⚠ ' + x).join('<br>');

    drawTrace(st.trace, e.band);
    rows(st);

    if (tone && gain) {
      // 220 Hz at half of best, 880 Hz at the peak
      const p = Math.max(0.5, Math.min(1, e.pct));
      osc.frequency.value = 220 * Math.pow(4, (p - 0.5) / 0.5);
      gain.gain.value = e.state === 'scene' ? 0 : 0.05;
    }
  } catch (err) { /* server restarting */ }
}
setInterval(poll, 125);
poll();
</script>
